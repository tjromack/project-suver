# Does this repo run from a fresh clone, with no keys and no local state?
#
# That is the whole point of this workflow: a clean container, the checked-in
# requirements, and the repo's own documented test command. If it passes here it
# passes for a reviewer who clones it cold.
#
# The venv is deliberate rather than installing into the runner's Python. Some of
# these Makefiles call `.venv/bin/python` and others call `pytest` from PATH, so
# creating the venv and adding it to PATH makes `make test` work as written —
# which is the command the README tells a reader to run.
name: clean-clone

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install from the checked-in requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test suite — offline, no API key
        run: make test
